<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #121212;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        #app {
            width: min(90vw, 600px);
            padding: 24px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d0d0d0;
            font-size: 0.95rem;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            color: #f5f5f5;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
        }

        select option {
            background-color: #1a1a1a;
            color: #f5f5f5;
        }

        button {
            width: 100%;
            padding: 12px 16px;
            margin-top: 20px;
            border-radius: 12px;
            border: none;
            background: rgba(100, 200, 100, 0.3);
            color: #f5f5f5;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: rgba(100, 200, 100, 0.5);
        }

        button:disabled {
            background: rgba(100, 100, 100, 0.2);
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div id="app">
    <h1>Transport Selector</h1>
    
    <div class="form-group">
        <label for="customerSelect">Select City:</label>
        <select id="customerSelect">
            <option value="">Loading customers...</option>
        </select>
    </div>

    <div class="form-group">
        <label for="stopSelect">Select Stop:</label>
        <select id="stopSelect" disabled>
            <option value="">Select a city first</option>
        </select>
    </div>

    <button id="submitBtn" disabled>View Departures</button>
</div>

<script>
let selectedPrefix = '';
let selectedStopId = '';

async function loadCustomers() {
    try {
        const response = await fetch('https://swinoujscie.kiedyprzyjedzie.pl/api/customers');
        const data = await response.json();
        
        const customerSelect = document.getElementById('customerSelect');
        customerSelect.innerHTML = '<option value="">Select a city</option>';
        
        if (data.customers && Array.isArray(data.customers)) {
            data.customers.forEach(customer => {
                const option = document.createElement('option');
                option.value = customer.prefix;
                option.textContent = customer.name;
                option.dataset.prefix = customer.prefix;
                customerSelect.appendChild(option);
            });
        }
    } catch (error) {
        console.error('Error loading customers:', error);
        document.getElementById('customerSelect').innerHTML = '<option value="">Error loading cities</option>';
    }
}

async function loadStops(prefix) {
    try {
        const response = await fetch(`https://${prefix}.kiedyprzyjedzie.pl/stops`);
        const data = await response.json();
        
        const stopSelect = document.getElementById('stopSelect');
        stopSelect.innerHTML = '<option value="">Select a stop</option>';
        
        if (data.stops && Array.isArray(data.stops)) {
            data.stops.forEach(stop => {
                const option = document.createElement('option');
                // Extract the 3rd value (index 2) from the stop array
                const stopName = Array.isArray(stop) ? stop[2] : stop;
                const stopId = Array.isArray(stop) ? stop[0] : '';
                
                option.value = stopId;
                option.textContent = stopName;
                stopSelect.appendChild(option);
            });
        }
        
        stopSelect.disabled = false;
    } catch (error) {
        console.error('Error loading stops:', error);
        document.getElementById('stopSelect').innerHTML = '<option value="">Error loading stops</option>';
    }
}

document.getElementById('customerSelect').addEventListener('change', (e) => {
    selectedPrefix = e.target.value;
    selectedStopId = '';
    
    const stopSelect = document.getElementById('stopSelect');
    const submitBtn = document.getElementById('submitBtn');
    
    if (selectedPrefix) {
        loadStops(selectedPrefix);
    } else {
        stopSelect.innerHTML = '<option value="">Select a city first</option>';
        stopSelect.disabled = true;
        submitBtn.disabled = true;
    }
});

document.getElementById('stopSelect').addEventListener('change', (e) => {
    selectedStopId = e.target.value;
    document.getElementById('submitBtn').disabled = !selectedStopId;
});

document.getElementById('submitBtn').addEventListener('click', () => {
    if (selectedPrefix && selectedStopId) {
        const customerName = document.getElementById('customerSelect').options[document.getElementById('customerSelect').selectedIndex].text;
        const stopName = document.getElementById('stopSelect').options[document.getElementById('stopSelect').selectedIndex].text;
        window.location.href = `index.html?city=${selectedPrefix}&station_id=${selectedStopId}`;
    }
});

// Load customers on page load
loadCustomers();
</script>
</body>
</html>
